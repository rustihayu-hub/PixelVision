<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelVision</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <style>
      @layer base {
        html, body { margin: 0; padding: 0; background-color: #0F172A; color: #F8FAFC; }
        body { overscroll-behavior: none; }
        main > :first-child { margin-top: 0 !important; }
        main > :last-child { margin-bottom: 0 !important; }
      }
      ::-webkit-scrollbar { display: none; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              // PIXELVISION BRAND COLORS
              "primary": "#5170FF",
              "background": "#0F172A",
              "surface": "#111827",
              "card": "#1E293B",
              "text-primary": "#F8FAFC",
              "text-secondary": "#94A3B8",
              "success": "#22C55E",
              "warning": "#F59E0B",
              "error": "#EF4444",

              // BACKWARD COMPATIBILITY MAPPINGS FOR EXISTING CLASSES
              "primary-container": "rgba(81, 112, 255, 0.15)",
              "on-primary-container": "#5170FF",
              "on-primary": "#FFFFFF",
              "primary-fixed-dim": "#5170FF",

              "surface-container-lowest": "#0F172A", // Same as background
              "surface-container-low": "#111827", // Same as surface
              "surface-container": "#1E293B", // Same as card
              "surface-container-high": "#334155", // Hover states / borders
              "surface-container-highest": "#475569", 
              "surface-variant": "#1E293B",
              "surface-dim": "#0F172A",

              "outline-variant": "#334155",
              "outline": "#475569",

              "on-surface": "#F8FAFC",
              "on-surface-variant": "#94A3B8",
              "on-background": "#F8FAFC",

              "secondary": "#94A3B8",
              "on-secondary": "#FFFFFF",
              "secondary-container": "#1E293B",
              "on-secondary-container": "#F8FAFC",

              "tertiary": "#64748B",
              "on-tertiary": "#F8FAFC",
              "tertiary-container": "#334155",
              
              "error-container": "rgba(239, 68, 68, 0.15)",
              "on-error": "#FFFFFF",
              "on-error-container": "#EF4444"
            },
            borderRadius: {
              "DEFAULT": "0.5rem",
              "lg": "0.75rem",
              "xl": "1rem",
              "full": "9999px"
            },
            spacing: {
              "space-xs": "0.25rem",
              "space-sm": "0.5rem",
              "space-md": "1rem",
              "space-lg": "1.5rem",
              "space-xl": "2rem",
              "space-2xl": "3rem",
              "gutter-sm": "1rem",
              "gutter": "1.5rem",
              "gutter-lg": "2rem",
            },
            fontFamily: {
              "display-lg": ["Inter", "sans-serif"],
              "headline-lg": ["Inter", "sans-serif"],
              "headline-sm": ["Inter", "sans-serif"],
              "body-lg": ["Inter", "sans-serif"],
              "body-md": ["Inter", "sans-serif"],
              "body-sm": ["Inter", "sans-serif"],
              "label-md": ["Inter", "sans-serif"],
              "label-sm": ["Inter", "sans-serif"],
              "code-lg": ["'JetBrains Mono'", "monospace"],
              "code-sm": ["'JetBrains Mono'", "monospace"],
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-background font-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
